{% extends "base.html" %}


{% block content %}
{% include 'nav.html' %}
<div id="content" class="container-fluid mt-3">

    <div class="gd-lib-head">
        <div class="gd-lib-title">
            <h1 class="gd-page-title mb-0">Library</h1>
            <p id="libraryStats" class="library-stats mb-0 d-none"></p>
        </div>
        <div class="gd-lib-tools">
            <label class="gd-search">
                <i class="bi bi-search" aria-hidden="true"></i>
                <span class="visually-hidden">Search titles...</span>
                <input type="text" id="textFilter" placeholder="Search titles...">
            </label>
            <div class="dropdown">
                <button type="button" class="btn btn-outline-secondary gd-tool" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                    <i class="bi bi-funnel" aria-hidden="true"></i> Filters <span class="gd-count d-none" id="filterCount"></span>
                </button>
                <div class="dropdown-menu dropdown-menu-end gd-filter-menu">
                <div class="gd-filter-group">
                    <div class="gd-filter-label">Show</div>
                    <div class="btn-group gd-seg" role="group" aria-label="Type filter">
                        <input type="radio" class="btn-check type-toggle" name="typeFilter" id="typeAll" autocomplete="off" checked>
                        <label class="btn btn-outline-primary btn-sm" for="typeAll">All</label>
                        <input type="radio" class="btn-check type-toggle" name="typeFilter" id="typeBase" autocomplete="off">
                        <label class="btn btn-outline-primary btn-sm" for="typeBase">Only games</label>
                        <input type="radio" class="btn-check type-toggle" name="typeFilter" id="typeDlc" autocomplete="off">
                        <label class="btn btn-outline-primary btn-sm" for="typeDlc">Only DLC</label>
                    </div>
                </div>
                <div class="gd-filter-group">
                    <div class="gd-filter-label">From the collection</div>
                    <div class="btn-group gd-seg" role="group" aria-label="Ownership filter">
                        <input type="radio" class="btn-check ownership-toggle" name="ownershipFilter" id="ownershipAll" autocomplete="off" checked>
                        <label class="btn btn-outline-primary btn-sm" for="ownershipAll">All</label>
                        <input type="radio" class="btn-check ownership-toggle" name="ownershipFilter" id="ownershipOwned" autocomplete="off">
                        <label class="btn btn-outline-primary btn-sm" for="ownershipOwned">What I have</label>
                        <input type="radio" class="btn-check ownership-toggle" name="ownershipFilter" id="ownershipMissing" autocomplete="off">
                        <label class="btn btn-outline-primary btn-sm" for="ownershipMissing">What I do not have</label>
                    </div>
                </div>
                <div class="gd-filter-group">
                    <div class="gd-filter-label">Update</div>
                    <div class="btn-group gd-seg" role="group" aria-label="Update filter">
                        <input type="radio" class="btn-check update-toggle" name="updateFilter" id="updateAll" autocomplete="off" checked>
                        <label class="btn btn-outline-primary btn-sm" for="updateAll">Any</label>
                        <input type="radio" class="btn-check update-toggle" name="updateFilter" id="updateUpToDate" autocomplete="off">
                        <label class="btn btn-outline-primary btn-sm" for="updateUpToDate">Up to date</label>
                        <input type="radio" class="btn-check update-toggle" name="updateFilter" id="updateMissingUpdate" autocomplete="off">
                        <label class="btn btn-outline-primary btn-sm" for="updateMissingUpdate">Missing update</label>
                    </div>
                </div>
                <div class="gd-filter-group">
                    <div class="gd-filter-label">DLC</div>
                    <div class="btn-group gd-seg" role="group" aria-label="Completion filter">
                        <input type="radio" class="btn-check completion-toggle" name="completionFilter" id="completionAll" autocomplete="off" checked>
                        <label class="btn btn-outline-primary btn-sm" for="completionAll">Any</label>
                        <input type="radio" class="btn-check completion-toggle" name="completionFilter" id="completionComplete" autocomplete="off">
                        <label class="btn btn-outline-primary btn-sm" for="completionComplete">With every DLC</label>
                        <input type="radio" class="btn-check completion-toggle" name="completionFilter" id="completionMissingDlc" autocomplete="off">
                        <label class="btn btn-outline-primary btn-sm" for="completionMissingDlc">Missing DLC</label>
                    </div>
                </div>
                    <button type="button" class="btn btn-link btn-sm px-0" id="clearFilters">Clear filters</button>
                </div>
            </div>
            <div class="btn-group" role="group" aria-label="View">
                <button id="view-toggle-btn-card" type="button" class="btn btn-outline-primary view-toggle-btn active" data-view="card" title="Cards" aria-label="Cards"><i class="bi bi-card-heading"></i></button>
                <button id="view-toggle-btn-icon" type="button" class="btn btn-outline-primary view-toggle-btn" data-view="icon" title="Icons" aria-label="Icons"><i class="bi bi-grid-fill"></i></button>
                <button id="view-toggle-btn-list" type="button" class="btn btn-outline-primary view-toggle-btn" data-view="list" title="List" aria-label="List"><i class="bi bi-list-ul"></i></button>
            </div>
            <div class="dropdown">
                <button type="button" class="btn btn-outline-secondary gd-tool" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" title="Display" aria-label="Display">
                    <i class="bi bi-sliders" aria-hidden="true"></i>
                </button>
                <div class="dropdown-menu dropdown-menu-end gd-filter-menu">
                    <div class="gd-filter-group">
                        <div class="gd-filter-label">Per page</div>
                        <div class="btn-group gd-seg" role="group" aria-label="Per page">
                            <button type="button" class="btn btn-outline-primary btn-sm items-per-page" data-value="12">12</button>
                            <button type="button" class="btn btn-outline-primary btn-sm items-per-page" data-value="24">24</button>
                            <button type="button" class="btn btn-outline-primary btn-sm items-per-page" data-value="48">48</button>
                            <button type="button" class="btn btn-outline-primary btn-sm items-per-page" data-value="96">96</button>
                        </div>
                    </div>
                    <div class="gd-filter-group mb-0" id="cardSizeGroup">
                        <label class="gd-filter-label" for="cardSizeRange">Card size</label>
                        <input type="range" class="form-range" min="1" max="5" step="1" id="cardSizeRange">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="activeFilters" class="gd-chips"></div>
    <div class="grid-container" id="gridContainer">
        <div class="row g-3" id="gameGrid"></div>
        <!-- <div class="row row-cols-1 row-cols-md-3 g-4" id="gameGrid"></div> -->
    </div>

    <!-- Pagination controls -->
    <nav aria-label="Page navigation" class="mt-3">
        <ul class="pagination justify-content-center" id="paginationControls"></ul>
    </nav>
</div>

<style>
    /* GameDock: list view of the library */
    .library-list-row { cursor: pointer; }
    .library-list-icon-cell { width: 64px; }
    .library-list-icon {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        object-fit: cover;
        display: block;
        background: var(--bs-secondary-bg);
    }
    .library-list-name { color: inherit; font-weight: 500; text-decoration: none; }
    .library-list-row:hover .library-list-name { text-decoration: underline; }
    .library-list .bi { font-size: 1.1rem; }
</style>
<script src="{{ url_for('static', filename='js/format.js') }}"></script>
<script>
    // The grid is served page by page: every render is one GraphQL call for exactly the
    // items on screen. Filters, search and ordering are query arguments, so a page of
    // N is always N items, whatever the filters.
    let itemsPerPage = 12;
    let currentPage = 1;
    let totalItems = 0;
    let cardSize = 3; // Default card size
    let currentView = 'card'; // Default view is 'card'
    let fetchSeq = 0;    // guards against an older request answering after a newer one
    let searchDebounce;

    // Active filters
    let activeTypeFilter = "";
    let activeOwnershipFilter = "";
    let activeUpdateFilter = "";
    let activeCompletionFilter = "";

    async function gqlFetch(query, variables) {
        // GET (not POST) so the browser's HTTP cache automatically revalidates
        // via If-None-Match against the ETag the server sets on every response.
        const params = new URLSearchParams({query});
        if (variables && Object.keys(variables).length) {
            params.set('variables', JSON.stringify(variables));
        }
        const r = await fetch('/api/graphql?' + params.toString(), {
            method: 'GET',
            headers: {'Accept': 'application/json'},
            credentials: 'same-origin',
        });
        if (!r.ok) throw new Error(`GraphQL HTTP ${r.status}`);
        const body = await r.json();
        if (body.errors && body.errors.length) {
            throw new Error('GraphQL errors: ' + JSON.stringify(body.errors));
        }
        return body.data;
    }

    // groupByAppId: one item per app id rather than per (app id, version), so a card
    // is an item and `pageSize` really is the number of cards on the page.
    const CARDS_QUERY = `
        query Cards($page: Int!, $pageSize: Int!, $appType: [AppType!], $search: String,
                    $owned: Boolean, $upToDate: Boolean, $complete: Boolean) {
            apps(groupByAppId: true, orderBy: {field: NAME}, page: $page, pageSize: $pageSize,
                 appType: $appType, search: $search, owned: $owned,
                 upToDate: $upToDate, complete: $complete) {
                total
                items {
                    appId
                    appType
                    owned
                    titledb { name banner(size: ORIGINAL) { url } icon(size: ORIGINAL) { url } }
                    title { titleId name ownership { haveBase upToDate complete } }
                    versions { version owned releaseDate displayVersion }
                }
            }
        }`;

    const ICONS_QUERY = `
        query Icons($page: Int!, $pageSize: Int!, $appType: [AppType!], $search: String,
                    $owned: Boolean, $upToDate: Boolean, $complete: Boolean) {
            apps(groupByAppId: true, orderBy: {field: NAME}, page: $page, pageSize: $pageSize,
                 appType: $appType, search: $search, owned: $owned,
                 upToDate: $upToDate, complete: $complete) {
                total
                items { appId titledb { icon(size: ORIGINAL) { url } } title { titleId } }
            }
        }`;

    function queryVariables() {
        let appType = null;
        if (activeTypeFilter) {
            appType = [activeTypeFilter];
        } else if (currentView === 'icon') {
            appType = ['BASE'];  // the icon wall is one icon per game, as it has always been
        } else {
            appType = ['BASE', 'DLC'];
        }
        const search = ($('#textFilter').val() || '').trim();
        return {
            page: currentPage,
            pageSize: itemsPerPage,
            appType: appType,
            search: search || null,
            owned: activeOwnershipFilter ? activeOwnershipFilter === 'Owned' : null,
            upToDate: activeUpdateFilter ? activeUpdateFilter === 'Up to date' : null,
            complete: activeCompletionFilter ? activeCompletionFilter === 'Complete' : null,
        };
    }

    async function loadPage() {
        const seq = ++fetchSeq;
        const isIcon = currentView === 'icon';
        let data;
        try {
            data = await gqlFetch(isIcon ? ICONS_QUERY : CARDS_QUERY, queryVariables());
        } catch (e) {
            console.error(e);
            return;
        }
        if (seq !== fetchSeq) return; // a newer request is already on its way back

        totalItems = data.apps.total;
        const totalPages = Math.max(1, Math.ceil(totalItems / itemsPerPage));
        if (currentPage > totalPages) { // filters shrank the result under our feet
            currentPage = totalPages;
            return loadPage();
        }

        $('#cardSizeRange').val(cardSize);
        $('#cardSizeRange').toggleClass('invisible', currentView === 'list');
        if (isIcon) {
            renderIconView(data.apps.items);
        } else if (currentView === 'list') {
            renderListView(data.apps.items.map(cardModel));
        } else {
            renderCardView(data.apps.items.map(cardModel));
        }
        updatePaginationControls(totalPages);

        // init version tooltips
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
        const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))

        // init version popovers
        const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]')
        const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl))
    }

    // Library-wide, so the line stays put while filters and search move the grid.
    const LIBRARY_STATS_QUERY = `
        query LibraryStats {
            stats {
                ownedTitles completeTitles upToDateTitles totalFiles totalSize
            }
        }`;

    async function loadLibraryStats() {
        let stats;
        try {
            stats = (await gqlFetch(LIBRARY_STATS_QUERY)).stats;
        } catch (e) {
            console.error(e);
            return;
        }
        // An empty install, or a visitor without shop access reading zeros: either way
        // the line has nothing to say and stays hidden.
        if (!stats.ownedTitles) return;

        const parts = [
            `${stats.ownedTitles.toLocaleString()} titles`,
            `${stats.completeTitles.toLocaleString()} complete`,
            `${stats.upToDateTitles.toLocaleString()} up to date`,
        ];
        // File figures are admin only and read zero for every other role, which is what
        // keeps the library's storage footprint off a shop user's screen.
        if (stats.totalFiles) {
            parts.push(`${stats.totalFiles.toLocaleString()} files`,
                       formatBytes(stats.totalSize));
        }

        const line = document.getElementById('libraryStats');
        line.innerHTML = '';
        parts.forEach(text => {
            const span = document.createElement('span');
            span.textContent = text;
            line.appendChild(span);
        });
        line.classList.remove('d-none');
    }

    function goToPage(page) {
        currentPage = page;
        loadPage();
    }

    function resetToFirstPage() {
        currentPage = 1;
        loadPage();
    }

    /**
     * One card from one app. A BASE app speaks for its title: ownership and the update
     * history come from the title, since a Switch update ships under its own app id.
     * A DLC app speaks for itself, and is up to date when its highest known version is
     * the one owned.
     */
    function cardModel(app) {
        const meta = app.titledb || {};
        const title = app.title || {};
        const ownership = title.ownership || {haveBase: false, upToDate: false, complete: false};
        const versions = (app.versions || []).map(v => ({
            version: v.version,
            owned: v.owned,
            release_date: v.releaseDate || 'Unknown',
            display_version: v.displayVersion,
        }));
        const isBase = app.appType === 'BASE';
        const recognized = isBase ? !!title.name : !!meta.name;

        if (isBase) {
            return {
                id: recognized ? title.titleId : title.titleId + ' not found in titledb',
                title_id: title.titleId,
                title_id_name: title.name || 'Unrecognized',
                name: title.name || 'Unrecognized',
                bannerUrl: (meta.banner || {}).url || '',
                iconUrl: (meta.icon || {}).url || '',
                app_type: 'BASE',
                owned: ownership.haveBase,
                has_latest_version: ownership.haveBase && ownership.upToDate,
                has_all_dlcs: ownership.complete,
                version: versions,
            };
        }

        const ownedVersions = versions.filter(v => v.owned).map(v => v.version);
        const highest = versions.length ? Math.max(...versions.map(v => v.version)) : 0;
        return {
            id: recognized ? app.appId : app.appId + ' not found in titledb',
            title_id: title.titleId,
            title_id_name: title.name || 'Unrecognized',
            name: meta.name || 'Unrecognized',
            bannerUrl: (meta.banner || {}).url || '',
            iconUrl: (meta.icon || {}).url || '',
            app_type: app.appType,
            owned: app.owned,
            has_latest_version: ownedVersions.length > 0 && Math.max(...ownedVersions) >= highest,
            version: versions,
        };
    }

    /** No banner falls back to the icon, then to a label - both in a box holding the
     *  banner's aspect ratio, so a card without artwork is the size of one with it. */
    function cardArtwork(game) {
        if (game.bannerUrl) {
            return $('<img class="card-img"></img>').attr('src', game.bannerUrl);
        }
        const box = $('<div class="card-img card-art-fallback"></div>');
        return game.iconUrl
            ? box.append($('<img class="card-art-icon">').attr('src', game.iconUrl))
            : box.append($('<span class="art-missing">Missing artwork</span>'));
    }

    function renderCardView(games) {
        const gameGrid = $('#gameGrid');
        gameGrid.empty(); // Clear existing games

        games.forEach(function (game) {
            const gameCol = $('<div class="col game-col"></div>').addClass(cardColumnClasses());

            const link = $('<a class="game-link"></a>').attr('href', `/title/${game.title_id}`);
            const card = $('<div class="card text-bg-dark game-card"></div>');

            card.append(cardArtwork(game));

            const cardOverlay = $('<div class="card-img-overlay game-info"></div>');

            const title = $('<h5 class="card-title game-title"></h5>').text(game.title_id_name || game.name);
            cardOverlay.append(title);

            const description = $('<p class="card-text game-description"></p>');
            if (game.app_type === 'DLC') {
                const small = $('<small></small>').text(`${game.name} | `);
                description.append(small);
            }
            const small = $('<small></small>').text(game.id);
            description.append(small);
            cardOverlay.append(description);

            const tagsContainer = $('<div class="tags-container"></div>');

            const typeBadgeClass = (game.owned === false) ? 'text-bg-warning' : 'text-bg-info';
            const typeBadge = $(`<span class="badge rounded-pill ${typeBadgeClass} game-tag"></span>`).text(game.app_type);
            tagsContainer.append(typeBadge);

            if (game.has_latest_version !== undefined) {
                const versionBadge = $(`<span class="badge rounded-pill game-tag version-tag" title="${game.name} Updates"></span>`)
                    .addClass(`text-bg-${game.has_latest_version ? 'success' : 'warning'}`)
                    .html(`<i class="bi ${game.has_latest_version ? 'bi-check-circle-fill' : 'bi-arrow-down-circle'}"></i>`);
                if (game.version !== undefined && game.version.length && Array.isArray(game.version)) {
                    const popoverContent = game.version.map(version =>
                        `${version.release_date}: v${version.version} ${version.owned ? 'Owned' : 'Missing'}`
                    ).join('\n');
                    versionBadge.popover({
                        content: popoverContent,
                        trigger: 'click',
                        placement: 'top',
                    });
                    versionBadge.css('cursor', 'pointer');
                    versionBadge.on('click', e => e.preventDefault());
                } else {
                    // version tooltip on hover
                    versionBadge.attr("data-bs-toggle", "tooltip")
                    versionBadge.attr("data-bs-placement", "top")
                    versionBadge.attr("data-bs-title", "Version v0")
                }
                tagsContainer.append(versionBadge);
            }

            if (game.has_all_dlcs !== undefined) {
                const dlcBadge = $('<span class="badge rounded-pill game-tag"></span>').addClass(`text-bg-${game.has_all_dlcs ? 'success' : 'warning'}`).html('<i class="bi bi-box-seam-fill"></i>');
                tagsContainer.append(dlcBadge);
            }

            cardOverlay.append(tagsContainer);
            card.append(cardOverlay);
            link.append(card);
            gameCol.append(link);
            gameGrid.append(gameCol);
        });
    }

    // GameDock: list view, one row per game with its status
    function renderListView(games) {
        const gameGrid = $('#gameGrid');
        gameGrid.empty();

        const table = $(`<table class="table table-hover align-middle library-list mb-0">
            <thead>
                <tr>
                    <th></th>
                    <th>Name</th>
                    <th class="d-none d-md-table-cell">Title ID</th>
                    <th>Type</th>
                    <th class="d-none d-sm-table-cell">Version</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>`);

        games.forEach(game => {
            const href = `/title/${game.title_id}`;
            const icon = game.iconUrl
                ? $('<img class="library-list-icon" loading="lazy" alt="">').attr('src', game.iconUrl)
                : $('<div class="library-list-icon"></div>');

            const name = $('<td></td>').append(
                $('<a class="library-list-name"></a>').attr('href', href).text(game.title_id_name || game.name));
            if (game.app_type === 'DLC') {
                name.append($('<div class="small text-body-secondary"></div>').text(game.name));
            }

            const owned = (game.version || []).filter(v => v.owned).sort((a, b) => b.version - a.version)[0];
            const version = owned ? (owned.display_version || `v${owned.version}`) : '—';
            const typeClass = game.owned === false ? 'text-bg-warning' : 'text-bg-info';

            const status = $('<td class="text-nowrap"></td>');
            if (game.has_latest_version !== undefined) {
                status.append(listStatusIcon(game.has_latest_version, 'bi-check-circle-fill', 'bi-arrow-down-circle',
                    game.has_latest_version ? 'Latest update owned' : 'Update missing'));
            }
            if (game.has_all_dlcs !== undefined) {
                status.append(listStatusIcon(game.has_all_dlcs, 'bi-box-seam-fill', 'bi-box-seam',
                    game.has_all_dlcs ? 'Every DLC owned' : 'DLC missing'));
            }

            // The whole row opens the game, like a card does
            const row = $('<tr class="library-list-row"></tr>').on('click', e => {
                if (!$(e.target).closest('a').length) {
                    window.location.href = href;
                }
            });
            row.append(
                $('<td class="library-list-icon-cell"></td>').append(icon),
                name,
                $('<td class="d-none d-md-table-cell font-monospace small"></td>').text(game.title_id || ''),
                $('<td></td>').append($(`<span class="badge rounded-pill ${typeClass}"></span>`).text(game.app_type)),
                $('<td class="d-none d-sm-table-cell"></td>').text(version),
                status,
            );
            table.find('tbody').append(row);
        });

        gameGrid.append($('<div class="col-12"></div>').append($('<div class="table-responsive"></div>').append(table)));
    }

    function listStatusIcon(ok, okIcon, missingIcon, label) {
        return $('<i class="bi me-2"></i>')
            .addClass(ok ? `${okIcon} text-success` : `${missingIcon} text-warning`)
            .attr('title', label)
            .attr('aria-label', label);
    }

    function renderIconView(apps) {
        const gameGrid = $('#gameGrid');
        gameGrid.empty(); // Clear existing games

        apps.forEach(app => {
            const iconUrl = ((app.titledb || {}).icon || {}).url || '';
            const icon = iconUrl
                ? $('<img class="game-icon">').attr('src', iconUrl)
                : $('<div class="game-icon game-icon--missing"><span class="art-missing">Missing artwork</span></div>');
            const link = $('<a class="game-icon-link"></a>')
                .attr('href', `/title/${(app.title || {}).titleId}`).append(icon);
            gameGrid.append(link);
        });

        // Adjust icon sizes based on the slider value
        adjustIconSizes(cardSize);
    }

    /** The slider sets how many cards a row holds, but only from `md` up: below that
     *  the screen cannot carry six of them, and a card too narrow to fit its own title
     *  grows an overlay taller than the banner it sits on. */
    function cardColumnClasses() {
        const columns = getColumnsForCardSize(cardSize);
        return `col-${12 / Math.min(columns, 2)} col-md-${12 / columns}`;
    }

    function getColumnsForCardSize(size) {
        switch (size) {
            case 1: return 1; // 2 columns
            case 2: return 2; // 3 columns
            case 3: return 3; // 4 columns
            case 4: return 4; // 6 columns
            case 5: return 6; // 8 columns
            default: return 4; // default to 3 columns
        }
    }

    /** Page numbers around the current one: the totals are server-side now, and a
     *  library of a few thousand apps would otherwise render a few hundred buttons. */
    function pageWindow(totalPages) {
        const pages = new Set([1, totalPages]);
        for (let i = currentPage - 2; i <= currentPage + 2; i++) {
            if (i >= 1 && i <= totalPages) pages.add(i);
        }
        const sorted = [...pages].sort((a, b) => a - b);
        const out = [];
        let previous = 0;
        for (const p of sorted) {
            if (previous && p - previous > 1) out.push('...');
            out.push(p);
            previous = p;
        }
        return out;
    }

    function updatePaginationControls(totalPages) {
        const paginationControls = $('#paginationControls');
        paginationControls.empty(); // Clear existing pagination

        // Previous button
        const prevButton = $('<li class="page-item"></li>').addClass(`page-item ${currentPage === 1 ? 'disabled' : ''}`).html(`
                <a class="page-link" href="#" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>`);
        prevButton.click(function (e) {
            e.preventDefault();
            if (currentPage > 1) {
                goToPage(currentPage - 1);
            }
        });
        paginationControls.append(prevButton);

        // Page numbers
        for (const entry of pageWindow(totalPages)) {
            if (entry === '...') {
                paginationControls.append($('<li class="page-item disabled"></li>').html('<span class="page-link">&hellip;</span>'));
                continue;
            }
            const pageButton = $('<li class="page-item"></li>').addClass(`page-item ${entry === currentPage ? 'active' : ''}`).html(`<a class="page-link" href="#">${entry}</a>`);
            pageButton.click(function (e) {
                e.preventDefault();
                goToPage(entry);
            });
            paginationControls.append(pageButton);
        }

        // Next button
        const nextButton = $('<li class="page-item"></li>').addClass(`page-item ${currentPage === totalPages ? 'disabled' : ''}`).html(`
                <a class="page-link" href="#" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>`);
        nextButton.click(function (e) {
            e.preventDefault();
            if (currentPage < totalPages) {
                goToPage(currentPage + 1);
            }
        });
        paginationControls.append(nextButton);
    }

    function adjustCardSizes() {
        const gameGrid = $('#gameGrid');
        const gameCols = gameGrid.find('.game-col');
        gameCols.each(function () {
            $(this).removeClass().addClass(`col game-col ${cardColumnClasses()}`);
        });
    }

    function adjustIconSizes() {
        // Calculate the size of the icons based on the slider value
        const iconSize = 100 / (cardSize + 3); // Assuming 100 is the maximum size

        // Update the CSS of the game icons - the link is what carries the width now,
        // since the icon fills it.
        $('.game-icon-link').css('width', `${iconSize}%`);
    }

    function saveFiltersToStorage() {
        localStorage.setItem('activeFilters', JSON.stringify({
            type: activeTypeFilter,
            ownership: activeOwnershipFilter,
            update: activeUpdateFilter,
            completion: activeCompletionFilter,
        }));
    }

    function loadFiltersFromStorage() {
        const savedFilters = localStorage.getItem('activeFilters');
        if (savedFilters) {
            const filters = JSON.parse(savedFilters);

            $('#typeBase').prop('checked', filters.type === 'BASE');
            $('#typeDlc').prop('checked', filters.type === 'DLC');

            $('#ownershipOwned').prop('checked', filters.ownership === 'Owned');
            $('#ownershipMissing').prop('checked', filters.ownership === 'Missing');

            $('#updateUpToDate').prop('checked', filters.update === 'Up to date');
            $('#updateMissingUpdate').prop('checked', filters.update === 'Outdated');

            $('#completionComplete').prop('checked', filters.completion === 'Complete');
            $('#completionMissingDlc').prop('checked', filters.completion === 'Missing DLC');

            updateFilter();
        }

        const savedSearch = localStorage.getItem('searchTerm');
        if (savedSearch) {
            $('#textFilter').val(savedSearch);
        }
    }

    /** Read the filter controls into the active* variables the query is built from. */
    function updateFilter() {
        if ($('#typeBase').is(":checked")) {
            activeTypeFilter = 'BASE';
        } else if ($('#typeDlc').is(":checked")) {
            activeTypeFilter = 'DLC';
        } else {
            activeTypeFilter = '';
        }
        if ($('#ownershipOwned').is(":checked")) {
            activeOwnershipFilter = 'Owned';
        } else if ($('#ownershipMissing').is(":checked")) {
            activeOwnershipFilter = 'Missing';
        } else {
            activeOwnershipFilter = '';
        }
        if ($('#updateUpToDate').is(":checked")) {
            activeUpdateFilter = 'Up to date';
        } else if ($('#updateMissingUpdate').is(":checked")) {
            activeUpdateFilter = 'Outdated';
        } else {
            activeUpdateFilter = '';
        }
        if ($('#completionComplete').is(":checked")) {
            activeCompletionFilter = 'Complete';
        } else if ($('#completionMissingDlc').is(":checked")) {
            activeCompletionFilter = 'Missing DLC';
        } else {
            activeCompletionFilter = '';
        }
    }

    function onFilterChange() {
        updateFilter();
        saveFiltersToStorage();
        resetToFirstPage();
    }

    $(document).ready(function () {
        const savedItemsPerPage = localStorage.getItem('itemsPerPage');
        if (savedItemsPerPage) {
            itemsPerPage = parseInt(savedItemsPerPage);
        }

        const savedCurrentView = localStorage.getItem('currentView');
        if (savedCurrentView) {
            currentView = savedCurrentView;
            $('.view-toggle-btn').removeClass("active");
            $(`.view-toggle-btn[data-view="${currentView}"]`).addClass("active");
        }

        const savedCardSize = localStorage.getItem('cardSize');
        if (savedCardSize){
            cardSize = parseInt(savedCardSize);
        }

        loadFiltersFromStorage();
        loadPage();
        loadLibraryStats();

        // Event listeners for items per page dropdown
        $('.items-per-page').click(function () {
            itemsPerPage = $(this).data('value');
            localStorage.setItem('itemsPerPage', itemsPerPage);
            resetToFirstPage();
        });

        $('#applyCustomItemsPerPage').click(function () {
            const customValue = $('#customItemsPerPage').val();
            if (customValue && customValue > 0) {
                itemsPerPage = parseInt(customValue);
                localStorage.setItem('itemsPerPage', itemsPerPage);
                resetToFirstPage();
            }
        });

        // Event listener for card size slider
        $('#cardSizeRange').on('input', function () {
            cardSize = parseInt($(this).val());
            localStorage.setItem('cardSize', cardSize);
            if (currentView === 'icon') {
                adjustIconSizes(cardSize);
            } else {
                adjustCardSizes(cardSize);
            }
        });

        // Event listener for view buttons
        $('.view-toggle-btn').click(function () {
            $('.view-toggle-btn').removeClass("active");
            $(this).addClass("active");
            currentView = $(this).data('view');
            localStorage.setItem('currentView', currentView);
            // The views page different things (every card vs one icon per game), so the
            // page number from the previous view means nothing here.
            resetToFirstPage();
        });

        $('.type-toggle, .ownership-toggle, .update-toggle, .completion-toggle').change(onFilterChange);

        // Listen to input changes in the text filter input
        $("#textFilter").on("input", function () {
            const attributeText = $(this).val();
            localStorage.setItem('searchTerm', attributeText);
            // Debounced: every keystroke would otherwise be its own query.
            clearTimeout(searchDebounce);
            searchDebounce = setTimeout(resetToFirstPage, 250);
        });

        // Close popovers
        $(document).on('click', function (e) {
            $('.popover').removeClass('show');
            $('.popover').remove();
        });

        // Add click event on the popover to stop propagation
        $(document).on('click', '.popover', function (e) {
            e.stopPropagation(); // Prevent the click event from bubbling up
        });

    });
</script>
<script>
    // Active filters as chips under the toolbar, and their number on the Filters button
    const FILTER_GROUPS = ['typeFilter', 'ownershipFilter', 'updateFilter', 'completionFilter'];

    function renderFilterChips() {
        const box = document.getElementById('activeFilters');
        box.innerHTML = '';
        let active = 0;
        FILTER_GROUPS.forEach(name => {
            const radios = [...document.querySelectorAll(`input[name="${name}"]`)];
            const checked = radios.find(r => r.checked);
            if (!checked || checked === radios[0]) return;
            active++;
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'gd-chip';
            chip.textContent = document.querySelector(`label[for="${checked.id}"]`).textContent;
            const x = document.createElement('i');
            x.className = 'bi bi-x';
            x.setAttribute('aria-hidden', 'true');
            chip.append(x);
            chip.addEventListener('click', () => $(radios[0]).prop('checked', true).trigger('change'));
            box.append(chip);
        });
        const count = document.getElementById('filterCount');
        count.textContent = active;
        count.classList.toggle('d-none', !active);
    }

    function markItemsPerPage() {
        $('.items-per-page').each(function () {
            $(this).toggleClass('active', $(this).data('value') == itemsPerPage);
        });
    }

    $(document).ready(function () {
        renderFilterChips();
        markItemsPerPage();
        $('.type-toggle, .ownership-toggle, .update-toggle, .completion-toggle').on('change', renderFilterChips);
        $('.items-per-page').on('click', () => setTimeout(markItemsPerPage));
        $('#clearFilters').on('click', () => {
            FILTER_GROUPS.forEach(name => { document.querySelector(`input[name="${name}"]`).checked = true; });
            onFilterChange();
            renderFilterChips();
        });
        // Card size only applies to cards and icons
        const syncCardSize = () => $('#cardSizeGroup').toggleClass('d-none', currentView === 'list');
        syncCardSize();
        $('.view-toggle-btn').on('click', () => setTimeout(syncCardSize));
    });
</script>
{% endblock %}
