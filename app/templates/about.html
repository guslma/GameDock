<!-- About GameDock: opened from the logo and name at the top left -->
<div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered about-dialog">
        <div class="modal-content about-content">
            <div class="about-header">
                <img src="{{ url_for('static', filename='logo/logo.svg') }}" alt="" width="40" height="40">
                <h1 class="about-title" id="aboutModalLabel">About GameDock</h1>
                <span class="about-version">v{{ gamedock_version }}</span>
                <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <p class="about-text">GameDock organizes your Nintendo Switch game collection and serves it on your network.</p>
            <p class="about-text about-small">
                <span>Based on</span> <a href="https://github.com/a1ex4/ownfoil" target="_blank" rel="noopener">Ownfoil</a> {{ ownfoil_version }}.
                <span>Free software under the</span> <a href="https://github.com/guslma/GameDock/blob/main/LICENSE" target="_blank" rel="noopener">AGPL-3.0</a>.
            </p>
            <div class="about-links">
                <a class="about-link" href="https://github.com/guslma/GameDock/tree/v{{ gamedock_version }}" target="_blank" rel="noopener">
                    <span class="about-link-icon"><i class="bi bi-github"></i></span>
                    <span>Source code</span>
                </a>
                <a class="about-link" href="https://github.com/a1ex4/ownfoil" target="_blank" rel="noopener">
                    <span class="about-link-icon"><i class="bi bi-diagram-2"></i></span>
                    <span>Original project</span>
                </a>
            </div>
            <div class="about-footer">
                <span>Made with</span>
                <i class="bi bi-heart-fill about-heart" aria-hidden="true"></i>
                <span>by</span>
                <a href="https://github.com/guslma" target="_blank" rel="noopener">guslma</a>
            </div>
        </div>
    </div>
</div>
<style>
    .about-dialog { max-width: 440px; }
    .about-content { padding: 22px 22px 0; border-radius: 16px; border: 1px solid var(--bs-border-color); }
    .about-header { display: flex; align-items: center; gap: 12px; }
    .about-header img { border-radius: 10px; flex: none; }
    .about-title { font-size: 1.3rem; font-weight: 700; margin: 0; }
    .about-version {
        font-size: .8rem; font-weight: 600; padding: 2px 8px; border-radius: 8px;
        border: 1px solid var(--bs-border-color); color: var(--bs-secondary-color);
    }
    .about-text { color: var(--bs-secondary-color); margin: 18px 0; line-height: 1.6; }
    .about-text.about-small { font-size: .85rem; margin-top: -8px; }
    .about-text a { color: #1FB8E8; text-decoration: none; }
    .about-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .about-link {
        display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px;
        border: 1px solid var(--bs-border-color); background: var(--bs-tertiary-bg);
        color: var(--bs-body-color); text-decoration: none; transition: border-color .15s;
    }
    .about-link:hover { border-color: #7B5CFF; color: var(--bs-body-color); }
    .about-link-icon {
        width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center;
        background: var(--bs-secondary-bg); font-size: 1.1rem; flex: none;
    }
    .about-footer {
        display: flex; justify-content: center; align-items: center; gap: 6px;
        margin-top: 22px; padding: 16px 0; border-top: 1px solid var(--bs-border-color);
        color: var(--bs-secondary-color);
    }
    .about-heart { color: #f0506e; }
    .about-footer a { color: #1FB8E8; font-weight: 600; text-decoration: none; }
    .about-footer a:hover { text-decoration: underline; }
    .navbar-brand[data-bs-target="#aboutModal"] { cursor: pointer; }
</style>
<script>
    // The menu can sit inside a positioned header; the dialog belongs to the page itself
    document.addEventListener('DOMContentLoaded', () => {
        const about = document.getElementById('aboutModal');
        if (about) document.body.appendChild(about);
    });
</script>
