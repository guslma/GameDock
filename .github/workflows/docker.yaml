name: Imagem

# Gera a imagem quando o GameDock muda e confere todo dia se saiu versão nova do Ownfoil
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'LICENSE']
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gamedock

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão mais recente do Ownfoil
        id: upstream
        run: |
          version=$(curl -fsSL https://api.github.com/repos/a1ex4/ownfoil/releases/latest | jq -r .tag_name)
          version=${version#v}
          [ -n "$version" ] && [ "$version" != null ] || { echo "versão não encontrada"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Ownfoil $version"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Na checagem diária, só gera de novo quando a versão do Ownfoil ainda não tem imagem
      - name: Já existe imagem desta versão?
        id: exists
        if: github.event_name == 'schedule'
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.upstream.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A versão ${{ steps.upstream.outputs.version }} do Ownfoil já tem imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.exists.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.skip != 'true'

      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: OWNFOIL_VERSION=${{ steps.upstream.outputs.version }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.upstream.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=GameDock
            org.opencontainers.image.description=Ownfoil renomeado e em vários idiomas
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.upstream.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0

      # Textos que cada idioma ainda não conhece (a maioria é código, não texto da tela)
      - name: Textos sem tradução
        if: steps.exists.outputs.skip != 'true'
        run: |
          image="$IMAGE:${{ steps.upstream.outputs.version }}"
          docker pull -q "$image" >/dev/null
          mkdir untranslated
          docker run --rm --entrypoint tar "$image" -C /app/untranslated -cf - . | tar -xf - -C untranslated
          echo "## GameDock com o Ownfoil ${{ steps.upstream.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          for file in untranslated/*.txt; do
            {
              echo
              echo "<details><summary>$(basename "$file" .txt): $(grep -c . "$file") textos sem tradução</summary>"
              echo
              echo '```'
              cat "$file"
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          done
