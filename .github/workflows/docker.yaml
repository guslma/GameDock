name: Imagem

# Testa e publica a imagem a cada mudança no código. A versão vem de app/VERSION: quando ela
# muda, a imagem ganha essa tag e o repositório ganha a tag vX.Y.Z (o link do código-fonte
# na janela Sobre aponta para ela)
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md', 'docs/**', 'LICENSE']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gamedock

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão do GameDock
        id: base
        run: echo "gamedock=$(cat app/VERSION)" >> "$GITHUB_OUTPUT"

      # Primeiro uma imagem só para testar: ela sobe, faz login e abre todas as telas nos 3 idiomas
      - name: Gerar imagem de teste
        run: docker build -t gamedock:test .

      - name: Testar
        run: tests/smoke.sh gamedock:test

      - name: Textos sem tradução
        if: always()
        run: |
          docker run --rm --entrypoint tar gamedock:test -C /app/untranslated -cf - . | tar -xf - -C . 2>/dev/null || exit 0
          for file in *.txt; do
            {
              echo "<details><summary>$(basename "$file" .txt): $(grep -c . "$file") textos sem tradução (a maioria é código)</summary>"
              echo
              echo '```'
              cat "$file"
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: docker/metadata-action@v5
        id: meta
        if: github.event_name != 'pull_request'
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.base.outputs.gamedock }},enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=GameDock
            org.opencontainers.image.licenses=AGPL-3.0

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'

      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request'

      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Marcar a versão no repositório
        if: github.ref == 'refs/heads/main'
        run: |
          tag="v${{ steps.base.outputs.gamedock }}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
