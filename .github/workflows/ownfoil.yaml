name: Versão nova do Ownfoil

# Todo dia confere se saiu versão nova do Ownfoil. Quando sai, aplica as mudanças dela no
# código do GameDock num branch e abre um pedido de atualização (pull request). O teste da
# imagem roda nele; nada chega ao servidor sem você aprovar (Merge).
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versões
        id: v
        run: |
          current=$(cat UPSTREAM)
          latest=$(curl -fsSL https://api.github.com/repos/a1ex4/ownfoil/releases/latest | jq -r .tag_name)
          latest=${latest#v}
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "GameDock usa o Ownfoil $current; o mais recente é o $latest" >> "$GITHUB_STEP_SUMMARY"
          if [ "$latest" = "$current" ] || git ls-remote --exit-code origin "refs/heads/ownfoil-$latest" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Aplicar as mudanças do Ownfoil
        if: steps.v.outputs.skip != 'true'
        id: apply
        env:
          CURRENT: ${{ steps.v.outputs.current }}
          LATEST: ${{ steps.v.outputs.latest }}
        run: |
          mkdir -p /tmp/up
          for v in "$CURRENT" "$LATEST"; do
            curl -fsSL "https://github.com/a1ex4/ownfoil/archive/refs/tags/$v.tar.gz" | tar -xz -C /tmp/up
          done
          git config user.name "guslma"
          git config user.email "141639311+guslma@users.noreply.github.com"
          git checkout -b "ownfoil-$LATEST"
          # Arquivo por arquivo: o que só o Ownfoil mudou entra; o que os dois mudaram nas
          # mesmas linhas fica com marcas de conflito no arquivo
          if python3 tools/merge_upstream.py "$(ls -d /tmp/up/*-"$CURRENT")" "$(ls -d /tmp/up/*-"$LATEST")" . > /tmp/merge.md; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/merge.md >> "$GITHUB_STEP_SUMMARY"
          echo "$LATEST" > UPSTREAM
          # Pacotes novos ou de outra versão: refaz a lista completa com as versões que o pip escolher
          if ! git diff --quiet HEAD -- requirements.txt; then
            image=$(sed -n 's/^FROM //p' Dockerfile | head -1)
            {
              sed -n '/^#/p' requirements.lock
              docker run --rm -v "$PWD/requirements.txt:/r.txt:ro" "$image" \
                sh -c 'pip install -q --root-user-action=ignore -r /r.txt >/dev/null && pip freeze'
            } > requirements.lock.new && mv requirements.lock.new requirements.lock
          fi
          git add -A
          git commit -q -m "Ownfoil $LATEST"
          git push -q origin "ownfoil-$LATEST"

      # Pedidos abertos por esta automação não disparam outros workflows, então o teste roda aqui
      - name: Testar a imagem com a versão nova
        if: steps.v.outputs.skip != 'true'
        id: test
        run: |
          if docker build -q -t gamedock:test . >/dev/null \
             && tests/smoke.sh gamedock:test > /tmp/smoke.txt 2>&1; then
            echo "result=passou" >> "$GITHUB_OUTPUT"
          else
            echo "result=falhou" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/smoke.txt || true

      - name: Pedido de atualização
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.v.outputs.latest }}
          CONFLICTS: ${{ steps.apply.outputs.conflicts }}
          RESULT: ${{ steps.test.outputs.result }}
        run: |
          body="O Ownfoil $LATEST saiu. Este pedido traz as mudanças dele para o GameDock.

          Notas da versão: https://github.com/a1ex4/ownfoil/releases/tag/$LATEST"
          if [ "$CONFLICTS" = true ]; then
            body="$body

          **Algumas mudanças não encaixaram sozinhas** (marcas de conflito nos arquivos): normalmente em telas que o GameDock reescreveu. Precisam de ajuste antes do Merge.

          $(cat /tmp/merge.md)"
          fi
          body="$body

          **Teste da imagem: $RESULT.** Ele sobe o app, entra e abre todas as telas nos 3 idiomas. Se passou, clique em Merge para atualizar o GameDock. Se falhou, peça o ajuste antes."
          gh pr create --head "ownfoil-$LATEST" --base main --title "Ownfoil $LATEST" --body "$body" \
            || gh issue create --title "Ownfoil $LATEST disponível" --body "$body

          Branch com as mudanças: https://github.com/${{ github.repository }}/compare/main...ownfoil-$LATEST"
